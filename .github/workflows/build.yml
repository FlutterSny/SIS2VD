name: Build SIS2VD

on:
  # Trigger on push to tags (release) OR push to main (build-only test)
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            display_name: Windows
          - os: ubuntu-latest
            display_name: Linux
    runs-on: ${{ matrix.os }}
    name: build (${{ matrix.display_name }})
    
    steps:
      # Step 1: Checkout the repository code
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Step 2: Setup Python 3.11
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'  # Cache pip dependencies for faster builds
      
      # Step 3: Install dependencies from requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      # Step 4: Install PyInstaller for building standalone executables
      - name: Install PyInstaller
        run: pip install pyinstaller
      
      # Step 5: Compile translation files (.ts to .qm)
      - name: Compile translations
        shell: bash
        run: |
          for ts_file in locales/*.ts; do
            pyside6-lrelease "$ts_file" -qm "${ts_file%.ts}.qm"
          done
      
      # Step 6: Determine icon file based on OS
      - name: Determine icon file
        id: icon
        shell: bash
        run: |
          if [ "${{ runner.os }}" == "Windows" ]; then
            if [ -f "assets/icon.ico" ]; then
              echo "icon_arg=--icon=assets/icon.ico" >> $GITHUB_OUTPUT
            else
              echo "icon_arg=" >> $GITHUB_OUTPUT
            fi
          else
            if [ -f "assets/icon.png" ]; then
              echo "icon_arg=--icon=assets/icon.png" >> $GITHUB_OUTPUT
            else
              echo "icon_arg=" >> $GITHUB_OUTPUT
            fi
          fi
      
      # Step 7: Determine OS-specific separator for --add-data flags
      - name: Determine data separator
        id: separator
        shell: bash
        run: |
          if [ "${{ runner.os }}" == "Windows" ]; then
            echo "separator=;" >> $GITHUB_OUTPUT
          else
            echo "separator=:" >> $GITHUB_OUTPUT
          fi
      
      # Step 8: Build standalone executable with PyInstaller
      # --onefile: Create a single executable file
      # --windowed: No console window (GUI application)
      # --name: Output executable name
      # --add-data: Include the src package and assets
      # Linux: Use spec file to exclude OpenSSL shared libraries to avoid version conflicts
      - name: Build with PyInstaller
        shell: bash
        run: |
          if [ "${{ runner.os }}" == "Linux" ]; then
            echo 'block_cipher = None' > SIS2VD.spec
            echo 'a = Analysis([' >> SIS2VD.spec
            echo "    ['run.py']," >> SIS2VD.spec
            echo '    pathex=[],' >> SIS2VD.spec
            echo '    binaries=[],' >> SIS2VD.spec
            echo "    datas=[('assets', 'assets'), ('locales', 'locales')]," >> SIS2VD.spec
            echo '    hiddenimports=[],' >> SIS2VD.spec
            echo '    hookspath=[],' >> SIS2VD.spec
            echo '    hooksconfig={},' >> SIS2VD.spec
            echo '    runtime_hooks=[],' >> SIS2VD.spec
            echo '    excludes=[],' >> SIS2VD.spec
            echo '    win_no_prefer_redirects=False,' >> SIS2VD.spec
            echo '    win_private_assemblies=False,' >> SIS2VD.spec
            echo '    cipher=block_cipher,' >> SIS2VD.spec
            echo '    noarchive=False,' >> SIS2VD.spec
            echo ')' >> SIS2VD.spec
            echo "a.binaries = [x for x in a.binaries if 'libssl' not in x[0].lower() and 'libcrypto' not in x[0].lower()]" >> SIS2VD.spec
            echo 'pyz = PYZ(a.pure, a.zipped_data, cipher=block_cipher)' >> SIS2VD.spec
            echo 'exe = EXE(' >> SIS2VD.spec
            echo '    pyz,' >> SIS2VD.spec
            echo '    a.scripts,' >> SIS2VD.spec
            echo '    a.binaries,' >> SIS2VD.spec
            echo '    a.zipfiles,' >> SIS2VD.spec
            echo '    a.datas,' >> SIS2VD.spec
            echo '    [],' >> SIS2VD.spec
            echo "    name='SIS2VD'," >> SIS2VD.spec
            echo '    debug=False,' >> SIS2VD.spec
            echo '    bootloader_ignore_signals=False,' >> SIS2VD.spec
            echo '    strip=False,' >> SIS2VD.spec
            echo '    upx=True,' >> SIS2VD.spec
            echo '    upx_exclude=[],' >> SIS2VD.spec
            echo '    runtime_tmpdir=None,' >> SIS2VD.spec
            echo '    console=False,' >> SIS2VD.spec
            echo '    disable_windowed_traceback=False,' >> SIS2VD.spec
            echo '    argv_emulation=False,' >> SIS2VD.spec
            echo '    target_arch=None,' >> SIS2VD.spec
            echo '    codesign_identity=None,' >> SIS2VD.spec
            echo '    entitlements_file=None,' >> SIS2VD.spec
            echo "    icon='assets/icon.png'" >> SIS2VD.spec
            echo ')' >> SIS2VD.spec
            pyinstaller SIS2VD.spec
          else
            pyinstaller --onefile --windowed ${{ steps.icon.outputs.icon_arg }} --name=SIS2VD --add-data="assets${{ steps.separator.outputs.separator }}assets" --add-data="locales${{ steps.separator.outputs.separator }}locales" run.py
          fi
      
      # Step 9: Determine output filename based on OS
      - name: Set output filename
        id: filename
        shell: bash
        run: |
          if [ "${{ runner.os }}" == "Windows" ]; then
            echo "artifact_name=SIS2VD.exe" >> $GITHUB_OUTPUT
            echo "binary_name=SIS2VD.exe" >> $GITHUB_OUTPUT
          else
            echo "artifact_name=SIS2VD-linux" >> $GITHUB_OUTPUT
            echo "binary_name=SIS2VD" >> $GITHUB_OUTPUT
          fi
      
      # Step 10: Upload the built binary as a GitHub Actions artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.filename.outputs.artifact_name }}
          path: dist/${{ steps.filename.outputs.binary_name }}

  # Release job: Only runs on tag pushes, depends on build job
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      # Step 1: Checkout code (needed for release notes generation)
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Step 2: Download Windows artifact from build job
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: SIS2VD.exe
          path: ./artifacts
      
      # Step 3: Download Linux artifact from build job
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: SIS2VD-linux
          path: ./artifacts

      # Rename Linux binary to match the expected release asset name
      - name: Rename Linux binary
        run: mv ./artifacts/SIS2VD ./artifacts/SIS2VD-linux
      
      # Step 4: Create GitHub Release with the tag as title
      # Automatically generates release notes from commits
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/SIS2VD.exe
            artifacts/SIS2VD-linux
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
